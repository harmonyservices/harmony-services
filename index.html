<!DOCTYPE html>
<html lang="fr">
<head>
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e9">

  <title>Harmony Services</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

  <!-- EN-TÊTE -->
  <header class="header">
    <div class="brandline">
      <div class="logo">
        <div class="logoMark">H</div>
        <div>
          <div class="brand">Harmony Services</div>
          <div class="subtitle">Gestion de la conciergerie</div>
        </div>
      </div>

      <div class="avatar">CB</div>
    </div>
  </header>


  <main class="content">

    <!-- =========================
         PLANNING
    ========================== -->

    <section id="planningPage" class="page">

      <h1>Planning</h1>
      <div class="date" id="todayLabel"></div>

      <div class="stats">

        <div class="stat">
          <div class="statNumber" id="statToday">0</div>
          <div class="statLabel">Aujourd'hui</div>
        </div>

        <div class="stat">
          <div class="statNumber" id="statTodo">0</div>
          <div class="statLabel">À faire</div>
        </div>

        <div class="stat">
          <div class="statNumber" id="statLinen">0</div>
          <div class="statLabel">Avec linge</div>
        </div>

      </div>


      <!-- FILTRES -->

      <div class="filters">

        <button class="filter active"
                data-filter="all"
                onclick="setFilter('all')">
          Tous
        </button>

        <button class="filter"
                data-filter="today"
                onclick="setFilter('today')">
          Aujourd'hui
        </button>

        <button class="filter"
                data-filter="todo"
                onclick="setFilter('todo')">
          À faire
        </button>

        <button class="filter"
                data-filter="done"
                onclick="setFilter('done')">
          Terminés
        </button>

      </div>

      <div id="planning"></div>

    </section>


    <!-- =========================
         CALENDRIER
    ========================== -->

    <section id="calendarPage" class="page hidden">

      <div class="pageHeader">
        <h1>Calendrier</h1>

        <button class="addSmall"
                onclick="openModal()">
          + Ajouter
        </button>
      </div>

      <div class="calendarControls">

        <button onclick="previousMonth()">‹</button>

        <div id="calendarMonth"></div>

        <button onclick="nextMonth()">›</button>

      </div>

      <div class="calendarLegend">

        <span>🧹 Ménage</span>

        <span>🧹 🧺 Ménage + linge</span>

        <span>🔧 Maintenance</span>

      </div>

      <div class="calendarWeek">

        <div>Lun</div>
        <div>Mar</div>
        <div>Mer</div>
        <div>Jeu</div>
        <div>Ven</div>
        <div>Sam</div>
        <div>Dim</div>

      </div>

      <div id="calendarGrid"
           class="calendarGrid">
      </div>

    </section>


    <!-- =========================
         LOGEMENTS
    ========================== -->

    <section id="propertiesPage"
             class="page hidden">

      <h1>Logements</h1>

      <div id="propertyList"></div>

    </section>


    <!-- =========================
         ÉQUIPE
    ========================== -->

    <section id="teamPage"
             class="page hidden">

      <h1>Équipe</h1>

      <div id="teamList"></div>

    </section>


    <!-- =========================
         LINGE
    ========================== -->

    <section id="linenPage"
             class="page hidden">

      <h1>Linge</h1>

      <div class="stats">

        <div class="stat">
          <div class="statNumber"
               id="linenDirty">
            0
          </div>

          <div class="statLabel">
            À traiter
          </div>
        </div>

        <div class="stat">
          <div class="statNumber"
               id="linenReady">
            0
          </div>

          <div class="statLabel">
            Prêt
          </div>
        </div>

      </div>

      <div id="linenList"></div>

    </section>

  </main>


  <!-- BOUTON + -->

  <button class="fab"
          id="fab"
          onclick="openModal()">
    +
  </button>


  <!-- NAVIGATION -->

  <nav class="bottomNav">

    <button class="nav active"
            onclick="showPage('planning',this)">

      <span class="navIcon">☷</span>
      Planning

    </button>


    <button class="nav"
            onclick="showPage('calendar',this)">

      <span class="navIcon">▦</span>
      Calendrier

    </button>


    <button class="nav"
            onclick="showPage('properties',this)">

      <span class="navIcon">⌂</span>
      Logements

    </button>


    <button class="nav"
            onclick="showPage('team',this)">

      <span class="navIcon">♙</span>
      Équipe

    </button>


    <button class="nav"
            onclick="showPage('linen',this)">

      <span class="navIcon">▤</span>
      Linge

    </button>

  </nav>

</div>


<!-- =========================
     FENÊTRE AJOUT PRESTATION
========================== -->

<div id="modal"
     class="modal hidden">

  <div class="modalBox">

    <div class="modalHead">

      <div class="modalTitle"
           id="modalTitle">
        Nouvelle prestation
      </div>

      <button class="close"
              onclick="closeModal()">
        ×
      </button>

    </div>


    <input type="hidden"
           id="editId">


    <!-- LOGEMENT -->

    <div class="formGroup">

      <label>Logement</label>

      <input id="propertyInput"
             placeholder="Ex : Studio Bouches du Loup">

    </div>


    <!-- DATE + HEURE -->

    <div class="two">

      <div class="formGroup">

        <label>Date</label>

        <input id="dateInput"
               type="date">

      </div>


      <div class="formGroup">

        <label>Heure</label>

        <input id="timeInput"
               type="time">

      </div>

    </div>


    <!-- TYPE -->

    <div class="formGroup">

      <label>Type de prestation</label>

      <select id="typeInput">

        <option value="cleaning">
          🧹 Ménage
        </option>

        <option value="cleaning_linen">
          🧹 🧺 Ménage + linge
        </option>

        <option value="maintenance">
          🔧 Maintenance
        </option>

      </select>

    </div>


    <!-- INTERVENANT -->

    <div class="formGroup">

      <label>Intervenant</label>

      <input id="personInput"
             placeholder="Ex : Sophie">

    </div>


    <!-- STATUT -->

    <div class="formGroup">

      <label>Statut</label>

      <select id="statusInput">

        <option value="todo">
          À faire
        </option>

        <option value="progress">
          En cours
        </option>

        <option value="done">
          Terminé
        </option>

      </select>

    </div>


    <!-- NOTES -->

    <div class="formGroup">

      <label>Notes</label>

      <textarea
        id="notesInput"
        placeholder="Code boîte à clés, consignes, matériel, problème à vérifier...">
      </textarea>

    </div>


    <button class="save"
            onclick="saveTask()">

      Enregistrer

    </button>


    <button id="deleteButton"
            class="delete hidden"
            onclick="deleteTask()">

      Supprimer la prestation

    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
